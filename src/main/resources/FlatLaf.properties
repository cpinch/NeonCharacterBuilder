# An 80s Vaporwave style palette
@styleParent = flatdark

# --- Color Palette ---
vaporDarkPurple = #1E0038
vaporDeepViolet = #2B0051
vaporHotPink = #FF71CE
vaporNeonBlue = #01CDFE
vaporElectricTeal = #05FFA1
vaporYellow = #FFFB96
vaporTextWhite = #f0e6ff
vaporMutedText = #8a73a6
vaporBlack = #101010

suggestion = $vaporNeonBlue

# --- Global UI Rules ---
background = $vaporDarkPurple
foreground = $vaporTextWhite
accentColor = $vaporHotPink
Component.borderColor = $vaporMutedText
Component.focusColor = $vaporNeonBlue
Component.disabledBorderColor = $vaporDarkPurple

# --- Component Level Styling ---
Panel.background = $vaporDarkPurple
Panel.foreground = $vaporTextWhite

Label.foreground = $vaporHotPink

Button.background = $vaporDeepViolet
Button.foreground = $vaporElectricTeal
Button.borderColor = $vaporHotPink
Button.disabledBackground = $vaporDarkPurple
Button.disabledText = $vaporMutedText
Button.hoverBackground = $vaporHotPink
Button.hoverForeground = $vaporBlack
Button.pressedBackground = $vaporHotPink
Button.pressedForeground = $vaporBlack
Button.focusedBackground = $vaporHotPink
Button.focusedForeground = $vaporBlack

TextField.background = $vaporDeepViolet
TextField.foreground = $vaporHotPink
TextField.caretForeground = $vaporTextWhite
TextField.caretColor = $vaporTextWhite
TextField.selectionBackground = $vaporTextWhite
TextField.selectionForeground = $vaporDarkPurple
# Not editable but enabled, this only exists for tool and vehicle profs for now, and those are changing, so will eventually be decom'd
TextField.inactiveBackground = $vaporDeepViolet

TextPane.background = $vaporDeepViolet
TextPane.foreground = $vaporHotPink
TextPane.caretForeground = $vaporTextWhite
TextPane.caretColor = $vaporTextWhite
TextPane.selectionBackground = $vaporTextWhite
TextPane.selectionForeground = $vaporDarkPurple

TextArea.background = $vaporDeepViolet
TextArea.foreground = $vaporHotPink
TextArea.border = 4,4,4,4,$vaporHotPink,1,4
TextArea.caretForeground = $vaporTextWhite
TextArea.caretColor = $vaporTextWhite
TextArea.selectionBackground = $vaporTextWhite
TextArea.selectionForeground = $vaporDarkPurple

ScrollBar.thumb = $vaporHotPink
ScrollBar.track = $vaporDarkPurple

TabbedPane.background = $vaporDarkPurple
TabbedPane.foreground = $vaporMutedText
TabbedPane.selectedBackground = $vaporNeonBlue
TabbedPane.selectedForeground = $vaporYellow

ComboBox.background = $vaporDeepViolet
ComboBox.foreground = $vaporYellow

CheckBox.background = $vaporDeepViolet
CheckBox.foreground = $vaporHotPink

RadioButton.background = $vaporDeepViolet
RadioButton.foreground = $vaporHotPink

List.background = $vaporDeepViolet
List.foreground = $vaporHotPink

SplitPane.background = $vaporDeepViolet
SplitPane.foreground = $vaporHotPink

Spinner.background = $vaporDeepViolet
Spinner.foreground = $vaporHotPink

OptionPane.background = $vaporDarkPurple
OptionPane.messageForeground = $vaporTextWhite